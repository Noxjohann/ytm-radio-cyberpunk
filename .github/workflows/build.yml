name: build

on:
  push:
    branches: [main]
    tags: ['v*']      # a tag like v0.1.0 also publishes a GitHub Release with the zip
  workflow_dispatch:

permissions:
  contents: write   # lets the last step publish the build logs to the ci-logs branch

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test and build (logged)
        id: build
        shell: bash
        continue-on-error: true
        run: |
          mkdir -p logs
          set +e
          cargo test > logs/test.full.log 2>&1
          echo "cargo test exit code: $?" >> logs/summary.txt
          cargo build --release > logs/build.full.log 2>&1
          code=$?
          echo "cargo build exit code: $code" >> logs/summary.txt
          tail -n 250 logs/test.full.log > logs/test.log
          tail -n 250 logs/build.full.log > logs/build.log
          exit $code

      - name: Publish logs to the ci-logs branch
        if: always()
        shell: bash
        run: |
          rm -rf ../logrepo && mkdir ../logrepo
          cp logs/summary.txt logs/test.log logs/build.log ../logrepo/ || true
          cd ../logrepo
          git init -q
          git checkout -q -b ci-logs
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          echo "commit ${GITHUB_SHA}" >> summary.txt
          git add .
          git commit -q -m "build logs for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs || echo "could not publish logs"

      - name: Package
        if: steps.build.outcome == 'success'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item -Recurse dist/* package/
          $mod = "package/bin/x64/plugins/cyber_engine_tweaks/mods/YtmRadio"
          Copy-Item target/release/ytm-radio.exe "$mod/ytm-radio.exe"
          Copy-Item README.md, LICENSE, LICENSE-SpotOnRadio.txt, THIRD-PARTY-NOTICES.txt package/

      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: ytm-radio
          path: package

      - name: Zip for the release
        if: steps.build.outcome == 'success' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path package/* -DestinationPath "YtmRadio-${{ github.ref_name }}.zip"

      - name: Create the GitHub Release
        if: steps.build.outcome == 'success' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "YtmRadio-${GITHUB_REF_NAME}.zip" \
            --title "YTM Radio ${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md

      - name: Fail the run if the build failed
        if: steps.build.outcome != 'success'
        shell: bash
        run: exit 1
