[package]
name = "ytm-radio"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
log = { version = "0.4", features = ["std"] }
# Pure-Rust MP3 encoder (LGPL-2.0), same version Spot On Radio uses.
shine-rs = "=0.1.5"
serde_json = "1"
base64 = "0.22"
# Window + embedded Edge (WebView2) that shows YouTube Music.
wry = "0.48"
tao = "0.31"

[profile.release]
opt-level = 3
lto = "thin"
